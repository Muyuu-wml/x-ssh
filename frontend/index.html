<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x-ssh</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="window-titlebar" id="window-titlebar">
      <div class="window-caption">
        <button class="caption-logo" id="btn-brand-top" type="button" title="返回主机管理（保留会话）" aria-label="返回主机管理">
          <img src="/src/assets/images/logo.png" alt="" draggable="false" />
        </button>
        <span>X-ssh</span>
      </div>
      <div class="window-controls">
        <button class="window-control" id="window-minimise" title="最小化" aria-label="最小化" data-icon="minimise"></button>
        <button class="window-control" id="window-maximise" title="最大化" aria-label="最大化" data-icon="maximise"></button>
        <button class="window-control window-close" id="window-close" title="关闭窗口" aria-label="关闭窗口" data-icon="close"></button>
      </div>
    </header>

    <div id="app">
      <!-- ---------------------------------------------------------- sidebar -->
      <aside id="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-label">主机</span>
          <span class="count" id="host-count">0</span>
          <button class="icon-btn" id="btn-new-group" type="button" title="新建分组" aria-label="新建分组" data-icon="folderPlus"></button>
          <button class="icon-btn" id="btn-new-host" type="button" title="新建主机" aria-label="新建主机" data-icon="plus"></button>
        </div>

        <div class="sidebar-search">
          <div class="search-wrap">
            <span data-icon="search"></span>
            <input id="search" class="search" type="search" placeholder="搜索主机" aria-label="搜索主机" autocomplete="off" spellcheck="false" title="搜索主机（Ctrl F）" />
          </div>
        </div>

        <div class="tree" id="tree"></div>

        <div class="sidebar-foot">
          <button class="settings-button" id="btn-settings"><span data-icon="settings"></span>设置</button>
        </div>
      </aside>

      <!-- ------------------------------------------------------------- main -->
      <main id="main">
        <div class="chrome">
          <header class="workspace-header">
            <div class="workspace-location">
              <button class="icon-btn" id="btn-back" type="button" title="返回主机管理" aria-label="返回主机管理" hidden data-icon="chevronLeft"></button>
              <div class="workspace-heading">
                <span id="workspace-title">主机管理</span>
                <span class="workspace-context" id="workspace-context">本地工作区</span>
              </div>
            </div>
            <div class="workspace-actions">
              <span class="session-chip" id="session-chip"><span class="status-dot"></span><span id="session-chip-text">暂无活动会话</span></span>
              <button class="btn btn-primary btn-sm" id="btn-empty-new"><span data-icon="plus"></span>新建主机</button>
            </div>
          </header>
          <div class="session-bar hidden" id="session-bar">
            <div class="tabstrip" id="tabstrip"></div>
          </div>
        </div>

        <div class="panes" id="panes"></div>

        <div class="empty" id="empty">
          <div class="dashboard">
            <div class="host-groups" id="host-grid"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- --------------------------------------------------- transfer panel -->
    <div id="transfer-panel" class="transfer-panel hidden">
      <div class="transfer-head">
        <span class="transfer-title"><span data-icon="transfer"></span>传输</span>
        <span class="transfer-summary" id="transfer-summary"></span>
        <button class="btn btn-sm" id="transfer-clear">清除已完成</button>
        <button class="icon-btn" id="transfer-collapse" title="收起列表" aria-label="收起传输列表" data-icon="chevron"></button>
        <button class="icon-btn" id="transfer-hide" title="隐藏" aria-label="隐藏传输面板" data-icon="close"></button>
      </div>
      <div class="transfer-list" id="transfer-list"></div>
    </div>

    <!-- ------------------------------------------------------------ modals -->
    <div id="modal-root"></div>

    <!-- ------------------------------------------------------------ toasts -->
    <div id="toasts"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
